<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCUti 校园人格测试</title>

  <style>
    :root {
      --scu-red: #b8272f;
      --scu-red-dark: #8e1621;
      --scu-gold: #f6c453;
      --ink: #1f232b;
      --muted: #6b7280;
      --soft-muted: #8a94a6;
      --paper: rgba(255, 255, 255, 0.9);
      --paper-strong: rgba(255, 255, 255, 0.96);
      --line: rgba(184, 39, 47, 0.13);
      --shadow: 0 24px 80px rgba(95, 39, 43, 0.15);
      --theme-from: #b8272f;
      --theme-to: #f59e0b;
      --theme-soft: #fff1f2;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        Arial,
        sans-serif;
      background:
        radial-gradient(circle at 10% 8%, rgba(184, 39, 47, 0.20), transparent 26%),
        radial-gradient(circle at 92% 10%, rgba(246, 196, 83, 0.22), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(59, 130, 246, 0.10), transparent 34%),
        linear-gradient(135deg, #fff7ed 0%, #fffaf4 46%, #f7fbff 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 999px;
      pointer-events: none;
      z-index: -1;
      filter: blur(6px);
    }

    body::before {
      width: 300px;
      height: 300px;
      left: -145px;
      bottom: 8%;
      background: rgba(184, 39, 47, 0.08);
    }

    body::after {
      width: 260px;
      height: 260px;
      right: -130px;
      top: 34%;
      background: rgba(245, 158, 11, 0.10);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .container {
      width: min(100% - 32px, 780px);
      margin: 0 auto;
      padding: 44px 0;
    }

    .page {
      display: none;
      animation: fadeIn 0.42s ease both;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 32px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.70), transparent 36%),
        radial-gradient(circle at 50% 0%, rgba(184, 39, 47, 0.06), transparent 44%);
    }

    .card-content {
      position: relative;
      z-index: 1;
    }

    .start-card,
    .question-card,
    .result-card {
      padding: clamp(26px, 5vw, 46px);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .hero {
      text-align: center;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: 100%;
      padding: 8px 16px 8px 10px;
      border: 1px solid rgba(184, 39, 47, 0.16);
      border-radius: 999px;
      color: var(--scu-red-dark);
      background: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 26px rgba(184, 39, 47, 0.10);
      white-space: nowrap;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      display: block;
      flex: 0 0 auto;
      border-radius: 50%;
      object-fit: contain;
      background: #fff;
      border: 1px solid rgba(184, 39, 47, 0.14);
      padding: 2px;
    }

    .title {
      margin-top: 22px;
      color: #16181d;
      font-size: clamp(36px, 8.5vw, 60px);
      line-height: 1.08;
      letter-spacing: -0.045em;
      font-weight: 900;
    }

    .title-line {
      display: block;
    }

    .title-highlight {
      display: inline-block;
      padding: 0 6px;
      background: linear-gradient(135deg, var(--scu-red) 0%, #f97316 82%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }


    .lead {
      max-width: 560px;
      margin: 18px auto 0;
      color: #5b6473;
      font-size: 17px;
      line-height: 1.9;
    }

    .mini-tags {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 30px 0 32px;
    }

    .mini-tag {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      border: 1px solid rgba(184, 39, 47, 0.12);
      border-radius: 999px;
      color: #4b5563;
      background: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      box-shadow: 0 8px 20px rgba(95, 39, 43, 0.06);
    }

    .primary-btn,
    .secondary-btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 900;
      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        background 0.22s ease;
    }

    .primary-btn {
      min-width: 164px;
      padding: 15px 34px;
      color: #fff;
      background: linear-gradient(135deg, var(--scu-red), #f97316);
      box-shadow: 0 16px 32px rgba(184, 39, 47, 0.24);
    }

    .secondary-btn {
      min-width: 132px;
      padding: 13px 28px;
      color: var(--theme-from);
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(184, 39, 47, 0.16);
    }

    .primary-btn:hover,
    .secondary-btn:hover {
      transform: translateY(-2px);
    }

    .primary-btn:active,
    .secondary-btn:active,
    .option-card:active {
      transform: translateY(0) scale(0.99);
    }

    .footnote {
      margin-top: 18px;
      color: #7c8493;
      font-size: 13px;
      line-height: 1.7;
    }

    .progress-wrap {
      margin-bottom: 28px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .question-index {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--scu-red-dark);
      background: rgba(184, 39, 47, 0.08);
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(107, 114, 128, 0.13);
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--scu-red), #f59e0b);
      transition: width 0.3s ease;
    }

    .question-text {
      margin-bottom: 24px;
      color: #191d26;
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.42;
      letter-spacing: -0.02em;
      font-weight: 900;
      text-wrap: balance;
    }

    .options {
      display: grid;
      gap: 14px;
    }

    .option-card {
      width: 100%;
      appearance: none;
      display: grid;
      grid-template-columns: 36px 1fr;
      align-items: start;
      gap: 13px;
      min-height: 68px;
      padding: 17px 18px;
      border: 1px solid rgba(107, 114, 128, 0.16);
      border-radius: 20px;
      color: #262a33;
      background: rgba(255, 255, 255, 0.82);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(31, 41, 55, 0.05);
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .option-card:hover,
    .option-card:focus-visible {
      outline: none;
      border-color: rgba(184, 39, 47, 0.48);
      background: #fff;
      box-shadow: 0 16px 36px rgba(31, 41, 55, 0.10);
      transform: translateX(5px);
    }

    .option-letter {
      width: 32px;
      height: 32px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      margin-top: 1px;
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(135deg, var(--scu-red), #f97316);
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(184, 39, 47, 0.18);
    }

    .option-text {
      display: block;
      color: #2f3440;
      font-size: 16px;
      line-height: 1.72;
      word-break: break-word;
    }

    .result-card {
      text-align: center;
    }

    .result-card::after {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 172px;
      background: linear-gradient(135deg, var(--theme-from), var(--theme-to));
      opacity: 0.13;
      pointer-events: none;
    }

    .result-inner {
      position: relative;
      z-index: 2;
    }

    .result-kicker {
      color: var(--muted);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .result-image-wrap {
      width: min(76vw, 320px);
      margin: 22px auto 16px;
      padding: 10px;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.92);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.90), rgba(255, 255, 255, 0.58));
      box-shadow: 0 22px 50px rgba(31, 41, 55, 0.16);
    }

    .result-image {
      width: 100%;
      display: block;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 25px;
      background: var(--theme-soft);
    }

    .result-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      max-width: 100%;
      margin: 8px auto 12px;
      padding: 8px 17px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 999px;
      color: var(--theme-from);
      background: var(--theme-soft);
      font-size: 14px;
      font-weight: 900;
      line-height: 1.35;
    }

    .result-name {
      margin-bottom: 16px;
      color: #15171c;
      font-size: clamp(34px, 8vw, 50px);
      line-height: 1.12;
      letter-spacing: -0.04em;
      font-weight: 950;
    }

    .result-desc {
      max-width: 620px;
      margin: 0 auto 24px;
      padding: 20px;
      border: 1px solid rgba(107, 114, 128, 0.12);
      border-radius: 22px;
      color: #4b5563;
      background: rgba(255, 255, 255, 0.76);
      text-align: left;
      font-size: 17px;
      line-height: 1.95;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }


    .ghost-btn {
      min-width: 116px;
      padding: 11px 18px;
      color: #5b6473;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(107, 114, 128, 0.18);
      appearance: none;
      cursor: pointer;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 900;
      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        background 0.22s ease,
        opacity 0.22s ease;
    }

    .ghost-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 12px 24px rgba(31, 41, 55, 0.08);
    }

    .ghost-btn:active {
      transform: translateY(0) scale(0.99);
    }

    .ghost-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
      box-shadow: none;
    }

    .question-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(107, 114, 128, 0.12);
    }

    .question-tip {
      color: var(--soft-muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: right;
    }

    .option-card {
      position: relative;
      overflow: hidden;
    }

    .option-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(184, 39, 47, 0.08), transparent 45%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .option-card:hover::after,
    .option-card:focus-visible::after {
      opacity: 1;
    }

    @media (max-width: 620px) {
      .container {
        width: min(100% - 24px, 780px);
        padding: 24px 0;
      }

      .start-card,
      .question-card,
      .result-card {
        padding: 24px 18px;
        border-radius: 26px;
      }

      .brand-pill {
        gap: 8px;
        padding: 7px 13px 7px 8px;
        font-size: 13px;
      }

      .brand-logo {
        width: 28px;
        height: 28px;
      }

      .lead {
        font-size: 15.5px;
        line-height: 1.85;
      }

      .mini-tags {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
        margin: 26px 0 30px;
      }

      .question-text {
        font-size: 23px;
        line-height: 1.45;
      }

      .option-card {
        grid-template-columns: 32px 1fr;
        gap: 11px;
        padding: 15px;
        border-radius: 18px;
      }

      .option-letter {
        width: 30px;
        height: 30px;
        border-radius: 10px;
      }

      .option-text {
        font-size: 15.5px;
        line-height: 1.75;
      }

      .result-desc {
        font-size: 15.8px;
        line-height: 1.92;
        padding: 18px;
      }

      .question-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .question-tip {
        text-align: left;
      }

      .ghost-btn {
        width: 100%;
      }

    }

    @media (max-width: 380px) {
      .container {
        width: min(100% - 18px, 780px);
      }

      .start-card,
      .question-card,
      .result-card {
        padding: 22px 14px;
      }

      .mini-tags {
        grid-template-columns: 1fr 1fr;
      }

      .primary-btn,
      .secondary-btn,
      .ghost-btn {
        width: 100%;
      }

      .result-actions {
        gap: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <!-- 首页 -->
    <section id="startPage" class="page active" aria-labelledby="startTitle">
      <div class="card start-card">
        <div class="card-content hero">
          <div class="brand-pill">
            <img
              class="brand-logo"
              src="images/scu-logo.png"
              alt="四川大学校徽"
            />
            <span>青春川大 · SCUti</span>
          </div>

          <h1 id="startTitle" class="title">
            <span class="title-line">你的校园版</span>
            <span class="title-line">
              <span class="title-highlight">专属人格</span>是什么？
            </span>
          </h1>

          <p class="lead">
            16 道生活化选择题，从上班鸭、校园猫咪到不高山，<br />
            测出更像你的川大校园人格。
          </p>

          <div class="mini-tags" aria-label="人格关键词">
            <span class="mini-tag">稳定靠谱</span>
            <span class="mini-tag">慵懒佛系</span>
            <span class="mini-tag">极致浪漫</span>
            <span class="mini-tag">奔赴热爱</span>
            <span class="mini-tag">实干担当</span>
            <span class="mini-tag">沉静独立</span>
            <span class="mini-tag">热血嘴硬</span>
            <span class="mini-tag">松弛通透</span>
          </div>

          <button id="startBtn" type="button" class="primary-btn">
            开始测试
          </button>

          <p class="footnote">
            选项没有标准答案，凭第一反应选择即可。
          </p>
        </div>
      </div>
    </section>

    <!-- 答题页 -->
    <section id="questionPage" class="page" aria-labelledby="questionText">
      <div class="card question-card">
        <div class="card-content">
          <div class="progress-wrap">
            <div class="progress-meta">
              <span class="question-index">
                题目 <span id="currentNum">1</span>/<span id="totalNum">16</span>
              </span>
              <span id="progressPercent">6%</span>
            </div>

            <div
              class="progress-track"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="6"
            >
              <div
                id="progressBar"
                class="progress-bar"
                style="width: 6%"
              ></div>
            </div>
          </div>

          <h2 id="questionText" class="question-text"></h2>
          <div id="optionsContainer" class="options"></div>

          <div class="question-actions">
            <button id="prevBtn" type="button" class="ghost-btn">
              上一题
            </button>
            <p class="question-tip">
              选项没有对错，按第一反应作答即可。
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- 结果页 -->
    <section id="resultPage" class="page" aria-labelledby="resultName">
      <div id="resultCard" class="card result-card">
        <div class="result-inner">
          <p class="result-kicker">你的 SCUti 人格是</p>

          <div class="result-image-wrap">
            <img id="resultImage" class="result-image" src="" alt="" />
          </div>

          <div id="resultTag" class="result-tag"></div>
          <h3 id="resultName" class="result-name"></h3>
          <p id="resultDesc" class="result-desc"></p>

          <div class="result-actions">
            <button id="editLastBtn" type="button" class="secondary-btn">
              修改上一题
            </button>
            <button id="restartBtn" type="button" class="primary-btn">
              重新测试
            </button>
            <button id="backHomeBtn" type="button" class="secondary-btn">
              返回首页
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ====================== SCUti 配置区 ======================
    const PERSONALITIES = [
      {
        id: 0,
        name: "上班鸭",
        tag: "稳定靠谱 · 治愈顶流",
        desc: "你是稳定靠谱的“治愈顶流”，就像明远湖常驻明星小鸭子，每天来去准时，清理水华，不但实实完成工作，还有自带的可爱从容气场，让每个路人会心一笑，你在安稳的节奏里，把生活过成光。",
        theme: { from: "#d97706", to: "#facc15", soft: "#fff7d6" },
        image: "images/shangbanya.png"
      },
      {
        id: 1,
        name: "校园猫咪",
        tag: "慵懒佛系 · 外柔内刚",
        desc: "你表面慵懒佛系，实际外柔内刚，就像学校的常驻小猫咪，可以在太阳下打一整天盹，也可以适应风雨顽强生活，你的自立自强，随遇而安，是喵星人特有的生存智慧。",
        theme: { from: "#ea580c", to: "#fdba74", soft: "#ffedd5" },
        image: "images/xiaoyuanmaomi.png"
      },
      {
        id: 2,
        name: "蓝花楹",
        tag: "极致浪漫 · 悄悄蓄力",
        desc: "你有极致浪漫的灵魂，默默扎根的定力。就像春夏之交突然占领街道的蓝花楹，用一年漫长的扎根蓄力，换一个蓝紫色的梦幻“雨季”。你在无人注目处努力生长，自有清风散漫幽香。",
        theme: { from: "#7c3aed", to: "#93c5fd", soft: "#ede9fe" },
        image: "images/lanhuaying.png"
      },
      {
        id: 3,
        name: "白石桥",
        tag: "理想主义 · 奔赴热爱",
        desc: "你是用青春奔赴热爱的理想家，就像无数青年艺术家扎堆驻足的白石桥，桥上荡漾着青春的声浪，洞里涂鸦着彩色的时光。世界再喧嚣，你也始终心怀滚烫，在平凡的日常里，坚守不凡的理想。",
        theme: { from: "#2563eb", to: "#f43f5e", soft: "#e0f2fe" },
        image: "images/baishiqiao.png"
      },
      {
        id: 4,

    let currentQuestion = 0;

    const startBtn = document.getElementById("startBtn");
    const prevBtn = document.getElementById("prevBtn");
    const editLastBtn = document.getElementById("editLastBtn");

    function switchPage(pageId) {
      document
        .querySelectorAll(".page")
        .forEach(page => page.classList.remove("active"));

      document.getElementById(pageId).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updatePrevButton() {
      if (!prevBtn) {
        return;
      }

      prevBtn.disabled = currentQuestion === 0 || answerHistory.length === 0;
    }

    function renderQuestion() {
      const q = QUESTIONS[currentQuestion];
      const percent = Math.round(((currentQuestion + 1) / QUESTIONS.length) * 100);

      currentNumEl.textContent = currentQuestion + 1;
      progressPercentEl.textContent = `${percent}%`;
      progressBarEl.style.width = `${percent}%`;
      progressTrackEl.setAttribute("aria-valuenow", String(percent));

      questionTextEl.textContent = q.text;
      optionsContainerEl.innerHTML = "";

      q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        const letter = String.fromCharCode(65 + index);

        btn.type = "button";
        btn.className = "option-card";
        btn.setAttribute("aria-label", `${letter}. ${opt.text}`);

        btn.innerHTML = `
          <span class="option-letter">${letter}</span>
          <span class="option-text">${opt.text}</span>
        `;

        btn.addEventListener("click", () => selectAnswer(opt.score));
        optionsContainerEl.appendChild(btn);
      });

      updatePrevButton();
    }

    function selectAnswer(scoreId) {
      totalScores[scoreId] += 1;
      answerHistory.push(scoreId);
      currentQuestion += 1;

      if (currentQuestion >= QUESTIONS.length) {
        showResult();
      } else {
        renderQuestion();
      }
    }

    function goBackOneQuestion() {
      if (answerHistory.length === 0) {
        return;
      }

      const lastScoreId = answerHistory.pop();
      totalScores[lastScoreId] = Math.max(0, totalScores[lastScoreId] - 1);
      currentQuestion = Math.max(0, currentQuestion - 1);

      renderQuestion();
      switchPage("questionPage");
    }

    function resolveTie(candidates) {
      // 用答题路径生成稳定散列，避免平分时总是偏向数组靠前的人格。
      const seed = answerHistory.reduce((acc, id, index) => {
        return (acc * 31 + (id + 1) * (index + 7)) % 1000003;
      }, 17);

      return candidates[seed % candidates.length];
    }

    function getResultIndex() {
      const maxScore = Math.max(...totalScores);

      const candidates = totalScores
        .map((score, index) => ({ score, index }))
        .filter(item => item.score === maxScore)
        .map(item => item.index);

      return candidates.length === 1 ? candidates[0] : resolveTie(candidates);
    }

    function applyTheme(result) {

      resultCard.style.setProperty("--theme-to", result.theme.to);
      resultCard.style.setProperty("--theme-soft", result.theme.soft);
    }

    function showResult() {
      const resultIndex = getResultIndex();

      };

      resultTagEl.textContent = result.tag;
      resultNameEl.textContent = result.name;
      resultDescEl.textContent = result.desc;

      switchPage("resultPage");
    }

    }
