<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCUti 校园人格测试</title>
  <style>
    :root {
      --scu-red: #b8272f;
      --scu-red-dark: #8e1621;
      --ink: #22242a;
      --muted: #6b7280;
      --line: #e8e1d8;
      --paper: rgba(255, 255, 255, 0.88);
      --bg-a: #fff7ed;
      --bg-b: #f8fbff;
      --theme-from: #b8272f;
      --theme-to: #f59e0b;
      --theme-soft: #fff1f2;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(184, 39, 47, 0.16), transparent 28%),
        radial-gradient(circle at 88% 8%, rgba(37, 99, 235, 0.12), transparent 25%),
        linear-gradient(135deg, var(--bg-a), var(--bg-b));
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 999px;
      background: rgba(184, 39, 47, 0.08);
      filter: blur(4px);
      pointer-events: none;
      z-index: -1;
    }

    body::before {
      left: -120px;
      bottom: 10%;
    }

    body::after {
      right: -140px;
      top: 34%;
      background: rgba(59, 130, 246, 0.08);
    }

    .container {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 42px 0;
    }

    .page {
      display: none;
      animation: fadeIn 0.42s ease both;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 28px;
      box-shadow: 0 22px 70px rgba(31, 41, 55, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .start-card,
    .question-card,
    .result-card {
      padding: clamp(24px, 5vw, 42px);
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--scu-red-dark);
      background: rgba(184, 39, 47, 0.1);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--scu-red);
      box-shadow: 0 0 0 5px rgba(184, 39, 47, 0.14);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .title {
      margin-top: 18px;
      font-size: clamp(34px, 8vw, 58px);
      line-height: 1.04;
      letter-spacing: -0.04em;
      color: #16181d;
    }

    .title span {
      display: inline-block;
      background: linear-gradient(135deg, var(--scu-red), #f97316);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      margin: 18px auto 0;
      max-width: 560px;
      color: #5d6472;
      font-size: 17px;
      line-height: 1.85;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      text-align: center;
    }

    .mini-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 26px 0 30px;
    }

    .mini-tag {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(184, 39, 47, 0.13);
      color: #4b5563;
      font-size: 13px;
      font-weight: 600;
    }

    .primary-btn,
    .secondary-btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      font-weight: 800;
      font-size: 16px;
      transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
    }

    .primary-btn {
      padding: 15px 34px;
      color: #fff;
      background: linear-gradient(135deg, var(--scu-red), #f97316);
      box-shadow: 0 16px 32px rgba(184, 39, 47, 0.23);
    }

    .primary-btn:hover,
    .secondary-btn:hover {
      transform: translateY(-2px);
    }

    .primary-btn:active,
    .secondary-btn:active,
    .option-card:active {
      transform: translateY(0) scale(0.99);
    }

    .secondary-btn {
      padding: 13px 28px;
      color: var(--theme-from);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(184, 39, 47, 0.16);
    }

    .progress-wrap {
      margin-bottom: 28px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(107, 114, 128, 0.13);
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--scu-red), #f59e0b);
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.35;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    .options {
      display: grid;
      gap: 14px;
    }

    .option-card {
      width: 100%;
      appearance: none;
      border: 1px solid rgba(107, 114, 128, 0.18);
      background: rgba(255, 255, 255, 0.78);
      color: #262a33;
      border-radius: 18px;
      padding: 17px 18px;
      text-align: left;
      cursor: pointer;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      align-items: start;
      font-size: 16px;
      line-height: 1.65;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .option-card:hover,
    .option-card:focus-visible {
      outline: none;
      border-color: rgba(184, 39, 47, 0.48);
      box-shadow: 0 14px 34px rgba(31, 41, 55, 0.1);
      transform: translateX(5px);
      background: #fff;
    }

    .option-letter {
      width: 30px;
      height: 30px;
      display: inline-grid;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      font-weight: 900;
      background: linear-gradient(135deg, var(--scu-red), #f97316);
      line-height: 1;
      margin-top: 1px;
      flex: 0 0 auto;
    }

    .result-card {
      text-align: center;
      position: relative;
    }

    .result-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 160px;
      background: linear-gradient(135deg, var(--theme-from), var(--theme-to));
      opacity: 0.13;
      pointer-events: none;
    }

    .result-inner {
      position: relative;
      z-index: 1;
    }

    .result-kicker {
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .result-image-wrap {
      width: min(78vw, 310px);
      margin: 20px auto 14px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.52));
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 22px 50px rgba(31, 41, 55, 0.15);
      padding: 10px;
    }

    .result-image {
      width: 100%;
      display: block;
      border-radius: 24px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: var(--theme-soft);
    }

    .result-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 16px;
      margin: 8px auto 12px;
      border-radius: 999px;
      color: var(--theme-from);
      background: var(--theme-soft);
      font-size: 14px;
      font-weight: 900;
      border: 1px solid rgba(255, 255, 255, 0.82);
    }

    .result-name {
      font-size: clamp(34px, 8vw, 48px);
      line-height: 1.12;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
      color: #15171c;
    }

    .result-desc {
      text-align: left;
      color: #4b5563;
      font-size: 17px;
      line-height: 1.95;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(107, 114, 128, 0.13);
      border-radius: 20px;
      padding: 20px;
      margin: 0 auto 24px;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .footnote {
      margin-top: 18px;
      color: #7c8493;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 560px) {
      .container {
        width: min(100% - 24px, 760px);
        padding: 24px 0;
      }

      .start-card,
      .question-card,
      .result-card {
        padding: 24px 18px;
        border-radius: 24px;
      }

      .option-card {
        grid-template-columns: 30px 1fr;
        padding: 15px;
      }

      .option-letter {
        width: 28px;
        height: 28px;
        border-radius: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <!-- 首页 -->
    <section id="startPage" class="page active" aria-labelledby="startTitle">
      <div class="card start-card">
        <div class="hero-grid">
          <div>
            <div class="brand-pill"><span class="brand-dot"></span>青春川大 · SCUti</div>
            <h1 id="startTitle" class="title">你的校园版<span>专属人格</span>是什么？</h1>
            <p class="lead">
              16 道生活化选择题，从上班鸭、校园猫咪到不高山，<br />
            测出更像你的川大校园人格。
            </p>
            <div class="mini-tags" aria-label="人格关键词">
              <span class="mini-tag">稳定靠谱</span>
              <span class="mini-tag">慵懒佛系</span>
              <span class="mini-tag">极致浪漫</span>
              <span class="mini-tag">奔赴热爱</span>
              <span class="mini-tag">实干担当</span>
              <span class="mini-tag">沉静独立</span>
              <span class="mini-tag">热血嘴硬</span>
              <span class="mini-tag">松弛通透</span>
            </div>
            <button id="startBtn" type="button" class="primary-btn">开始测试</button>
            <p class="footnote">选项没有标准答案，凭第一反应选择就好。</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 答题页 -->
    <section id="questionPage" class="page" aria-labelledby="questionText">
      <div class="card question-card">
        <div class="progress-wrap">
          <div class="progress-meta">
            <span>题目 <span id="currentNum">1</span>/<span id="totalNum">16</span></span>
            <span id="progressPercent">6%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="6">
            <div id="progressBar" class="progress-bar" style="width: 6%"></div>
          </div>
        </div>
        <h2 id="questionText" class="question-text"></h2>
        <div id="optionsContainer" class="options"></div>
      </div>
    </section>

    <!-- 结果页 -->
    <section id="resultPage" class="page" aria-labelledby="resultName">
      <div id="resultCard" class="card result-card">
        <div class="result-inner">
          <p class="result-kicker">你的 SCUti 人格是</p>
          <div class="result-image-wrap">
            <img id="resultImage" class="result-image" src="" alt="" />
          </div>
          <div id="resultTag" class="result-tag"></div>
          <h3 id="resultName" class="result-name"></h3>
          <p id="resultDesc" class="result-desc"></p>
          <div class="result-actions">
            <button id="restartBtn" type="button" class="primary-btn">重新测试</button>
            <button id="backHomeBtn" type="button" class="secondary-btn">返回首页</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>

        ]
      },
      {

        options: [
          { text: "一边喊累一边熬，ddl前爆发惊人战力", score: 6 },
          { text: "按科学的复习表稳步推进，尽量不让自己失控", score: 0 },

        ]
      },
      {
        text: "当团队出现分歧、气氛紧张时，你会怎么做？",
        options: [
          { text: "先安抚情绪，让大家冷静下来再沟通", score: 7 },
          { text: "保持旁观，等别人主导，不主动卷入争执", score: 5 },
          { text: "快速梳理矛盾点，给出可行方案推动共识", score: 4 },
          { text: "活跃气氛，用轻松方式缓和尴尬", score: 6 }

    // =========================================================

    let currentQuestion = 0;
    let totalScores = new Array(PERSONALITIES.length).fill(0);
    let answerHistory = [];

    const startPage = document.getElementById("startPage");
    const questionPage = document.getElementById("questionPage");
    const resultPage = document.getElementById("resultPage");
    const resultCard = document.getElementById("resultCard");

    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const backHomeBtn = document.getElementById("backHomeBtn");

    const currentNumEl = document.getElementById("currentNum");
    const totalNumEl = document.getElementById("totalNum");
    const progressPercentEl = document.getElementById("progressPercent");
    const progressBarEl = document.getElementById("progressBar");
    const progressTrackEl = document.querySelector(".progress-track");

    const questionTextEl = document.getElementById("questionText");
    const optionsContainerEl = document.getElementById("optionsContainer");

    const resultImageEl = document.getElementById("resultImage");
    const resultTagEl = document.getElementById("resultTag");
    const resultNameEl = document.getElementById("resultName");
    const resultDescEl = document.getElementById("resultDesc");

    totalNumEl.textContent = QUESTIONS.length;


    function switchPage(pageId) {
      document.querySelectorAll(".page").forEach(page => page.classList.remove("active"));
      document.getElementById(pageId).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestion() {
      const q = QUESTIONS[currentQuestion];
      const percent = Math.round(((currentQuestion + 1) / QUESTIONS.length) * 100);

      currentNumEl.textContent = currentQuestion + 1;
      progressPercentEl.textContent = `${percent}%`;
      progressBarEl.style.width = `${percent}%`;
      progressTrackEl.setAttribute("aria-valuenow", String(percent));

      questionTextEl.textContent = q.text;
      optionsContainerEl.innerHTML = "";

      q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-card";
        btn.setAttribute("aria-label", `${String.fromCharCode(65 + index)}. ${opt.text}`);
        btn.innerHTML = `
          <span class="option-letter">${String.fromCharCode(65 + index)}</span>
          <span>${opt.text}</span>
        `;
        btn.addEventListener("click", () => selectAnswer(opt.score));
        optionsContainerEl.appendChild(btn);
      });
    }

    function selectAnswer(scoreId) {
      totalScores[scoreId] += 1;
      answerHistory.push(scoreId);
      currentQuestion += 1;

      if (currentQuestion >= QUESTIONS.length) {
        showResult();
      } else {
        renderQuestion();
      }
    }

    function resolveTie(candidates) {
      // 用答题路径生成稳定散列，避免 tied 情况下总是偏向数组靠前的人格。
      const seed = answerHistory.reduce((acc, id, index) => {
        return (acc * 31 + (id + 1) * (index + 7)) % 1000003;
      }, 17);
      return candidates[seed % candidates.length];
    }

    function getResultIndex() {
      const maxScore = Math.max(...totalScores);
      const candidates = totalScores
        .map((score, index) => ({ score, index }))
        .filter(item => item.score === maxScore)
        .map(item => item.index);

      return candidates.length === 1 ? candidates[0] : resolveTie(candidates);
    }

    function applyTheme(result) {
      resultCard.style.setProperty("--theme-from", result.theme.from);
      resultCard.style.setProperty("--theme-to", result.theme.to);
      resultCard.style.setProperty("--theme-soft", result.theme.soft);
    }

    function showResult() {
      const resultIndex = getResultIndex();
      const result = PERSONALITIES[resultIndex];

      applyTheme(result);
      resultImageEl.src = result.image;
      resultImageEl.alt = `${result.name}人格形象图`;
      resultImageEl.onerror = () => {
        resultImageEl.alt = `${result.name}人格形象图加载失败，请检查图片路径：${result.image}`;
        console.warn(`图片加载失败：${result.image}`);
      };
      resultTagEl.textContent = result.tag;
      resultNameEl.textContent = result.name;
      resultDescEl.textContent = result.desc;

      switchPage("resultPage");
    }

    function resetTest() {
      currentQuestion = 0;
      totalScores = new Array(PERSONALITIES.length).fill(0);
      answerHistory = [];
      renderQuestion();
      switchPage("questionPage");
    }

    function backHome() {
      currentQuestion = 0;
      totalScores = new Array(PERSONALITIES.length).fill(0);
      answerHistory = [];
      switchPage("startPage");
    }

    function validateQuestionDistribution() {
      const counts = new Array(PERSONALITIES.length).fill(0);
      const positionCounts = PERSONALITIES.map(() => [0, 0, 0, 0]);

      QUESTIONS.forEach(q => {
        q.options.forEach((opt, position) => {
          counts[opt.score] += 1;
          positionCounts[opt.score][position] += 1;
        });
      });

      const isBalanced = counts.every(count => count === QUESTIONS.length / 2)
        && positionCounts.every(row => row.every(count => count === 2));

      if (!isBalanced) {
        console.warn("SCUti 题库分布未完全均衡，请检查 counts 与 positionCounts：", {
          counts,
          positionCounts
        });
      }
    }

    startBtn.addEventListener("click", () => {
      currentQuestion = 0;
      totalScores = new Array(PERSONALITIES.length).fill(0);
      answerHistory = [];
      renderQuestion();
      switchPage("questionPage");
    });

    restartBtn.addEventListener("click", resetTest);
    backHomeBtn.addEventListener("click", backHome);

    validateQuestionDistribution();
  </script>
